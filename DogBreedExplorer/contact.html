<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://images.dogapi.dog https://dogapi.dog data:; connect-src 'self' https://dogapi.dog; object-src 'none'; base-uri 'none'; form-action 'none'">

  <title>About / Contact | Dog Breed Explorer</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&amp;family=Nunito:wght@400;600;700&amp;display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header>
    <nav class="container site-nav" aria-label="Main navigation">
      <a class="brand" href="index.html"><span class="paw-mark" aria-hidden="true">🐾</span> Dog Breed Explorer</a>
      <div class="nav-links">
        <a href="index.html" >Home</a>
        <a href="contact.html" aria-current="page">About / Contact</a>
        <button id="animationToggle" class="animation-toggle" type="button" hidden>Hide animations</button>
      </div>
    </nav>
  </header>

  <noscript><p class="container">Enable JavaScript to use the feedback form.</p></noscript>

  <!-- Decorative dog art: Pet Dogs Pack by LuizMelo (https://luizmelo.itch.io/pet-dogs-pack). -->
  <main id="main" tabindex="-1" class="container main-content">

    <section class="intro contact-intro has-stickers">
      <p class="eyebrow">ABOUT THIS PROJECT</p>
      <h1>About / Contact <span aria-hidden="true">🐾</span></h1>
      <p>Dog Breed Explorer is a small educational website for learning about dogs. Breed information and pictures come from the <a href="https://dogapi.dog/">Dog API</a>.</p>
      <div class="dog-parade hero-parade contact-parade" aria-hidden="true">
        <img class="dog-sprite large" src="images/sprites/golden-stretching.gif" alt="">
        <img class="dog-sprite large" src="images/sprites/akita-bark.gif" alt="">
        <img class="dog-sprite large" src="images/sprites/great-dane-lying-down.gif" alt="">
      </div>
    </section>

    <section class="panel has-stickers" aria-labelledby="feedbackTitle">
      <h2 id="feedbackTitle"><span aria-hidden="true">🐾</span> Feedback</h2>
      <form id="contactForm" method="post" novalidate>
        <div class="mb-3">
          <label for="name" class="form-label">Name (required)</label>
          <input id="name" class="form-control" maxlength="80" required autocomplete="off">
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email (required)</label>
          <input id="email" type="email" class="form-control" maxlength="120" required autocomplete="off">
        </div>
        <div class="mb-3">
          <label for="message" class="form-label">Message (required)</label>
          <textarea id="message" class="form-control" rows="4" maxlength="1000" required></textarea>
        </div>
        <button class="btn btn-dark" type="submit">Submit</button>
        <p id="formStatus" class="status" role="status" aria-live="polite"></p>
      </form>
      <div class="dog-parade panel-parade spaced" aria-hidden="true">
        <img class="dog-sprite" src="images/sprites/schnauzer-licking2.gif" alt="">
        <img class="dog-sprite" src="images/sprites/saint-bernard-idle.gif" alt="">
        <img class="dog-sprite" src="images/sprites/husky-itching.gif" alt="">
      </div>
    </section>


  </main>

  <footer class="container site-footer"><span aria-hidden="true">🐾</span> Dog Breed Explorer · <a href="https://dogapi.dog/">Dog API</a></footer>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.min.js"></script>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
